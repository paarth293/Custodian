[package]
name = "custodian-store"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1.0", features = ["full"] }
uuid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
