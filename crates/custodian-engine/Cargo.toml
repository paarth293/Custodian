[package]
name = "custodian-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
custodian-store = { path = "../custodian-store" }
custodian-journal = { path = "../custodian-journal" }
custodian-digest = { path = "../custodian-digest" }
custodian-winsec = { path = "../custodian-winsec" }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
notify = "6.1.1"
custodian-proto = { path = "../custodian-proto" }

