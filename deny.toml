[graph]
all-features = true

[advisories]
ignore = [
    # proc-macro-error is unmaintained (not a vulnerability). It is pulled in
    # by gtk-rs via Tauri's Linux tray backend and has no upstream fix yet.
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk; Linux-only, no fix available" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
