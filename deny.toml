[advisories]
ignore = [
    "RUSTSEC-2024-0436",  # paste - unmaintained, pulled in by sqlx, no fix available
    "RUSTSEC-2024-0363",  # sqlx 0.7.x vuln - tracked for upgrade, not exploitable without >4GiB inputs
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
