[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services/mlhost/mlhost/proto.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["mlhost", "fixture_root"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "services/mlhost"
explicit_package_bases = true
exclude = [
    "^target/",
    "^node_modules/",
    "^deliverables/",
    "^artifacts/",
    "^\\.local/",
    "^fixture/",
    "^models/",
    "^apps/desktop/src-tauri/runtime-stage/",
]

[tool.pytest.ini_options]
pythonpath = ["services/mlhost", "services/mlhost/tests"]
testpaths = ["services/mlhost/tests", "tests"]
