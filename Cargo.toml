[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/paarth293/custodian"
publish = false

[workspace.dependencies]
# Internal crates
custodian-approval = { path = "crates/custodian-approval" }
custodian-core = { path = "crates/custodian-core" }
custodian-digest = { path = "crates/custodian-digest" }
custodian-ipc = { path = "crates/custodian-ipc" }
custodian-journal = { path = "crates/custodian-journal" }
custodian-ledger = { path = "crates/custodian-ledger" }
custodian-proto = { path = "crates/custodian-proto" }
custodian-store = { path = "crates/custodian-store" }
custodian-winsec = { path = "crates/custodian-winsec" }

# Third-party crates
blake3 = "1.5"
byteorder = "1.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.3"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hmac = "0.12"
notify = "6.1"
proptest = "1.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
windows = "0.62"
windows-future = "0.3"
windows-sys = "0.61"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "abort"
