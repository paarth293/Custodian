[package]
name = "custodian-desktop"
description = "Custodian desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "custodian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
custodian-approval.workspace = true
custodian-core.workspace = true
custodian-ipc.workspace = true
custodian-ledger.workspace = true
custodian-winsec.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
sysinfo = { workspace = true, features = ["system"] }
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
